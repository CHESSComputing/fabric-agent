# Diagnostic output on stderr (results always go to stdout):
#   off    nothing
#   info   one line per step: node API calls (URL, status, size, time), LLM calls, the plan
#   debug  + response bodies, the prompts sent to the LLM and its raw reply (truncated)
#   trace  + the same, untruncated
# Overridden by env FABRIC_AGENT_LOG_LEVEL and by the --log-level flag.
log_level: "info"

fabric_node:
  catalog_url: "http://localhost:8781"
  data_url: "http://localhost:8782"
  identity_url: "http://localhost:8783"
  notification_url: "http://localhost:8784"
  auth_token: ""            # or env FABRIC_AUTH_TOKEN; sent as "Authorization: Bearer ..."
  timeout_seconds: 30

agent:
  # How questions are understood:
  #   openai     OpenAI or any OpenAI-compatible server (vLLM, LM Studio, ...; set base_url)
  #   anthropic  Anthropic Messages API
  #   ollama     local Ollama server (data never leaves the machine)
  #   heuristic  no LLM, keyword search only ("mock" and "live" are aliases)
  mode: "ollama"
  api_key: ""               # or env OPENAI_API_KEY / ANTHROPIC_API_KEY
  base_url: ""              # optional endpoint override (default http://localhost:11434 for ollama)
  model: "mistral"          # e.g. gpt-4o, claude-sonnet-5-5, llama3.1
  temperature: 0.1          # negative = do not send (some reasoning models require this)
  max_tokens: 1024          # cap on generated tokens (Ollama: num_predict)
  num_ctx: 8192             # Ollama context window; its default is small and silently truncates prompts
  timeout_seconds: 300      # per LLM request; local models on CPU can be slow

  max_retries: 2            # the LLM may repair a plan this many times (-1 = never)
  max_rows: 100             # rows printed per result table
  schema_ttl_seconds: 300   # how long the node's beamlines/graphs are cached
  summarize: false          # also answer in prose from the results (one more LLM call)

storage:
  download_dir: "./tmp/downloads"
  output_dir: "./tmp/derived"
